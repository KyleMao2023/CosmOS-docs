<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="1000" viewBox="0 0 1600 1000"
     role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">CosmOS 当前 Dentry Cache 结构</title>
  <desc id="svg-desc">全局 RwLock 保护的两级 dentry cache：外层按父目录分桶，内层按名字查找，条目区分正缓存和负缓存，并使用原子引用位配合 CLOCK 回收。</desc>

  <defs>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6091"/>
      <stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>
    <linearGradient id="green-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3EA89B"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
    <linearGradient id="blue-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7F2F7"/>
      <stop offset="100%" stop-color="#DCEFF0"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324F" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#1E6091"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#2A9D8F"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#D97757"/>
    </marker>
    <style>
      .sans { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .title { font-size: 34px; font-weight: 700; fill: #102A43; }
      .subtitle { font-size: 17px; fill: #5B738B; }
      .section-title { font-size: 21px; font-weight: 700; fill: #16324F; }
      .section-code { font-size: 13px; fill: #49657D; }
      .label { font-size: 16px; fill: #16324F; }
      .small { font-size: 13px; fill: #5B738B; }
      .tiny { font-size: 12px; fill: #5B738B; }
      .code { font-size: 14px; fill: #16324F; }
      .white-title { font-size: 23px; font-weight: 700; fill: #FFFFFF; }
      .white-code { font-size: 14px; fill: #E8F8F5; }
      .card { fill: #FFFFFF; stroke: #C9DDE3; stroke-width: 1.5; }
      .muted-card { fill: #F7FBFB; stroke: #C9DDE3; stroke-width: 1.5; }
      .divider { stroke: #C9DDE3; stroke-width: 1; }
      .arrow-label { font-size: 12px; font-weight: 600; fill: #2A728E; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#F4F9F9"/>
  <path d="M 64 128 H 1536" stroke="#D7E8EA" stroke-width="2"/>

  <!-- Title -->
  <text x="64" y="65" class="sans title">CosmOS · 当前 Dentry Cache 结构</text>
  <text x="66" y="98" class="sans subtitle">两级目录分桶 + RwLock 读路径 + 原子 CLOCK 引用位</text>
  <rect x="1352" y="47" width="184" height="42" rx="21" fill="#E3F4EE" stroke="#A8D9C8"/>
  <circle cx="1378" cy="68" r="7" fill="#52B788"/>
  <text x="1395" y="74" class="sans label" fill="#1E806A">ch9 · BuildStorm</text>

  <!-- Left: callers -->
  <g filter="url(#card-shadow)">
    <rect x="64" y="150" width="302" height="500" rx="16" class="card"/>
    <rect x="64" y="150" width="302" height="67" rx="16" fill="url(#green-gradient)"/>
    <rect x="64" y="201" width="302" height="16" fill="url(#green-gradient)"/>
    <text x="88" y="188" class="sans white-title">并发查找入口</text>
    <text x="88" y="208" class="mono white-code">lookup_dentry(fs, parent, name)</text>

    <text x="88" y="252" class="sans small">多个线程可同时走读路径</text>

    <rect x="88" y="274" width="254" height="72" rx="11" fill="#EAF7F1" stroke="#A8D9C8"/>
    <circle cx="110" cy="300" r="7" fill="#52B788"/>
    <text x="128" y="305" class="mono code">statx(path)</text>
    <text x="128" y="328" class="sans small">元数据热点</text>

    <rect x="88" y="366" width="254" height="72" rx="11" fill="#EAF3F8" stroke="#B7D3E0"/>
    <circle cx="110" cy="392" r="7" fill="#1E6091"/>
    <text x="128" y="397" class="mono code">openat(dirfd, name)</text>
    <text x="128" y="420" class="sans small">路径解析热点</text>

    <rect x="88" y="458" width="254" height="72" rx="11" fill="#EAF7F1" stroke="#A8D9C8"/>
    <circle cx="110" cy="484" r="7" fill="#3EA89B"/>
    <text x="128" y="489" class="mono code">fstatat(...)</text>
    <text x="128" y="512" class="sans small">同一查找接口复用缓存</text>

    <path d="M 88 574 H 342" class="divider"/>
    <text x="88" y="603" class="sans small">命中后直接返回 Arc&lt;Inode&gt;</text>
    <text x="88" y="625" class="sans small">或已知 ENOENT；只有 Miss 访问后端。</text>
  </g>

  <!-- Arrows from callers to read lock -->
  <path d="M 366 310 C 382 310, 388 282, 408 282" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 366 402 H 408" fill="none" stroke="#1E6091" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 366 494 C 382 494, 388 522, 408 522" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="369" y="270" class="sans arrow-label">read()</text>
  <text x="372" y="390" class="sans arrow-label">read()</text>
  <text x="369" y="548" class="sans arrow-label">read()</text>

  <!-- Center: cache manager -->
  <g filter="url(#card-shadow)">
    <rect x="408" y="150" width="800" height="500" rx="16" class="card"/>
    <rect x="408" y="150" width="800" height="78" rx="16" fill="url(#header-gradient)"/>
    <rect x="408" y="212" width="800" height="16" fill="url(#header-gradient)"/>
    <text x="438" y="184" class="sans white-title">全局 DentryCache</text>
    <text x="438" y="208" class="mono white-code">DENTRY_CACHE: RwLock&lt;DentryCache&gt;</text>
    <rect x="1062" y="169" width="118" height="35" rx="17" fill="#FFFFFF" fill-opacity="0.18" stroke="#D8F4EE"/>
    <text x="1083" y="192" class="mono" font-size="14" font-weight="700" fill="#FFFFFF">RwLock</text>

    <rect x="438" y="247" width="740" height="51" rx="10" fill="url(#blue-gradient)" stroke="#B7D3E0"/>
    <circle cx="462" cy="273" r="8" fill="#52B788"/>
    <text x="482" y="279" class="mono code">DENTRY_CACHE.read()</text>
    <text x="701" y="279" class="sans small">多个 statx / openat 读者并发进入</text>

    <!-- Outer directory map -->
    <rect x="438" y="319" width="274" height="286" rx="12" class="muted-card"/>
    <rect x="438" y="319" width="274" height="53" rx="12" fill="#E5F1F7" stroke="#B7D3E0"/>
    <rect x="438" y="357" width="274" height="15" fill="#E5F1F7"/>
    <text x="458" y="344" class="sans section-title" font-size="18">外层目录表</text>
    <text x="458" y="363" class="mono section-code">BTreeMap&lt;ParentKey, ...&gt;</text>

    <rect x="458" y="389" width="234" height="58" rx="9" fill="#FFFFFF" stroke="#8FC5D2" stroke-width="1.5"/>
    <circle cx="477" cy="411" r="5" fill="#1E6091"/>
    <text x="490" y="415" class="mono" font-size="12.5" fill="#16324F">(fs=1, ino=42)</text>
    <text x="490" y="435" class="sans small">/src · 当前桶</text>

    <rect x="458" y="457" width="234" height="58" rx="9" fill="#FFFFFF" stroke="#C9DDE3"/>
    <circle cx="477" cy="479" r="5" fill="#3EA89B"/>
    <text x="490" y="483" class="mono" font-size="12.5" fill="#16324F">(fs=1, ino=108)</text>
    <text x="490" y="503" class="sans small">/target/debug</text>

    <rect x="458" y="525" width="234" height="58" rx="9" fill="#FFFFFF" stroke="#C9DDE3"/>
    <circle cx="477" cy="547" r="5" fill="#8FC5D2"/>
    <text x="490" y="551" class="mono" font-size="12.5" fill="#16324F">(fs=1, ino=...)</text>
    <text x="490" y="571" class="sans small">其他父目录桶</text>

    <!-- Inner name map -->
    <rect x="744" y="319" width="434" height="286" rx="12" class="muted-card"/>
    <rect x="744" y="319" width="434" height="53" rx="12" fill="#EAF7F1" stroke="#A8D9C8"/>
    <rect x="744" y="357" width="434" height="15" fill="#EAF7F1"/>
    <text x="764" y="344" class="sans section-title" font-size="18">内层名字表</text>
    <text x="764" y="363" class="mono section-code">BTreeMap&lt;String, DentryEntry&gt;</text>

    <path d="M 713 430 H 737" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="704" y="407" text-anchor="end" class="mono arrow-label">get(&amp;parent)</text>
    <rect x="785" y="379" width="370" height="24" rx="12" fill="#DFF3EA"/>
    <text x="970" y="396" text-anchor="middle" class="mono" font-size="12" fill="#1E806A">get(name: &amp;str) · String: Borrow&lt;str&gt; · 零分配</text>

    <!-- Table header -->
    <text x="766" y="427" class="mono tiny">name</text>
    <text x="885" y="427" class="mono tiny">lookup</text>
    <text x="1005" y="427" class="mono tiny">child</text>
    <text x="1117" y="427" class="mono tiny">ref_bit</text>

    <!-- Entry rows -->
    <rect x="758" y="438" width="406" height="45" rx="7" fill="#FFFFFF" stroke="#B7D3E0"/>
    <text x="770" y="466" class="mono" font-size="13" fill="#16324F">main.rs</text>
    <rect x="875" y="448" width="83" height="25" rx="12" fill="#DFF3EA"/>
    <text x="916" y="466" text-anchor="middle" class="mono" font-size="11.5" fill="#1E806A">Positive</text>
    <text x="982" y="466" class="mono" font-size="12" fill="#16324F">Arc&lt;Inode&gt;</text>
    <rect x="1125" y="448" width="25" height="25" rx="12" fill="#52B788"/>
    <text x="1137.5" y="466" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">1</text>

    <rect x="758" y="490" width="406" height="45" rx="7" fill="#FFF6F0" stroke="#F0C3AF"/>
    <text x="770" y="518" class="mono" font-size="13" fill="#16324F">missing.rs</text>
    <rect x="875" y="500" width="83" height="25" rx="12" fill="#FCE7DC"/>
    <text x="916" y="518" text-anchor="middle" class="mono" font-size="11.5" fill="#B9573B">Negative</text>
    <text x="982" y="518" class="mono" font-size="12" fill="#16324F">None → ENOENT</text>
    <rect x="1125" y="500" width="25" height="25" rx="12" fill="#52B788"/>
    <text x="1137.5" y="518" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">1</text>

    <rect x="758" y="542" width="406" height="45" rx="7" fill="#FFFFFF" stroke="#C9DDE3"/>
    <text x="770" y="570" class="mono" font-size="13" fill="#16324F">Cargo.toml</text>
    <rect x="875" y="552" width="83" height="25" rx="12" fill="#DFF3EA"/>
    <text x="916" y="570" text-anchor="middle" class="mono" font-size="11.5" fill="#1E806A">Positive</text>
    <text x="982" y="570" class="mono" font-size="12" fill="#16324F">Arc&lt;Inode&gt;</text>
    <rect x="1125" y="552" width="25" height="25" rx="12" fill="#B7D3E0"/>
    <text x="1137.5" y="570" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#16324F">0</text>

    <!-- Atomic ref-bit annotation -->
    <path d="M 1137 576 C 1137 594, 1118 604, 1094 612" fill="none" stroke="#52B788" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="834" y="612" width="328" height="26" rx="13" fill="#DFF3EA"/>
    <text x="998" y="630" text-anchor="middle" class="mono" font-size="11.5" fill="#1E806A">AtomicBool ref_bit · 读锁下可标记引用</text>
  </g>

  <!-- Right: three-state result -->
  <g filter="url(#card-shadow)">
    <rect x="1250" y="150" width="286" height="500" rx="16" class="card"/>
    <rect x="1250" y="150" width="286" height="67" rx="16" fill="url(#blue-gradient)" stroke="#B7D3E0"/>
    <rect x="1250" y="201" width="286" height="16" fill="url(#blue-gradient)"/>
    <text x="1274" y="188" class="sans section-title">DentryLookup</text>
    <text x="1274" y="208" class="mono section-code">Positive · Negative · Miss</text>

    <path d="M 1208 401 H 1238" fill="none" stroke="#1E6091" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="1218" y="386" class="sans arrow-label">返回三态</text>

    <rect x="1274" y="258" width="238" height="78" rx="11" fill="#EAF7F1" stroke="#A8D9C8"/>
    <circle cx="1298" cy="284" r="7" fill="#52B788"/>
    <text x="1316" y="289" class="mono code">Positive</text>
    <text x="1298" y="314" class="mono small">Arc&lt;Inode&gt; → 直接返回</text>

    <rect x="1274" y="356" width="238" height="78" rx="11" fill="#FFF6F0" stroke="#F0C3AF"/>
    <circle cx="1298" cy="382" r="7" fill="#D97757"/>
    <text x="1316" y="387" class="mono code">Negative</text>
    <text x="1298" y="412" class="mono small">None → 已知 ENOENT</text>

    <rect x="1274" y="454" width="238" height="78" rx="11" fill="#EAF3F8" stroke="#B7D3E0"/>
    <circle cx="1298" cy="480" r="7" fill="#1E6091"/>
    <text x="1316" y="485" class="mono code">Miss</text>
    <text x="1298" y="510" class="sans small">继续查询 VFS / ext4</text>

    <path d="M 1274 568 H 1512" class="divider"/>
    <text x="1274" y="597" class="sans small">正、负查找都能命中内存</text>
    <text x="1274" y="620" class="sans small">减少工具链的重复路径解析。</text>
  </g>

  <!-- Bottom: maintenance and eviction -->
  <g filter="url(#card-shadow)">
    <rect x="64" y="688" width="1472" height="244" rx="16" class="card"/>

    <!-- CLOCK -->
    <rect x="88" y="712" width="432" height="196" rx="12" fill="#F7FBFB" stroke="#C9DDE3"/>
    <rect x="88" y="712" width="432" height="48" rx="12" fill="#EAF3F8" stroke="#B7D3E0"/>
    <rect x="88" y="748" width="432" height="12" fill="#EAF3F8"/>
    <text x="110" y="742" class="sans section-title" font-size="18">CLOCK 回收队列</text>
    <text x="110" y="783" class="mono code">inactive: VecDeque&lt;DentryKey&gt;</text>
    <rect x="110" y="800" width="103" height="31" rx="7" fill="#DCEFF0"/>
    <text x="161.5" y="821" text-anchor="middle" class="mono" font-size="11.5" fill="#1E6091">src/main.rs</text>
    <rect x="222" y="800" width="103" height="31" rx="7" fill="#DCEFF0"/>
    <text x="273.5" y="821" text-anchor="middle" class="mono" font-size="11.5" fill="#1E6091">Cargo.toml</text>
    <rect x="334" y="800" width="82" height="31" rx="7" fill="#DCEFF0"/>
    <text x="375" y="821" text-anchor="middle" class="mono" font-size="11.5" fill="#1E6091">…</text>
    <path d="M 431 815 H 478" fill="none" stroke="#1E6091" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="110" y="858" class="sans small">ref_bit=1 → 二次机会；ref_bit=0 → 回收</text>
    <text x="110" y="883" class="sans small">高水位 16K · 低水位 12K</text>

    <!-- Write and invalidation -->
    <rect x="544" y="712" width="432" height="196" rx="12" fill="#F7FBFB" stroke="#C9DDE3"/>
    <rect x="544" y="712" width="432" height="48" rx="12" fill="#EAF7F1" stroke="#A8D9C8"/>
    <rect x="544" y="748" width="432" height="12" fill="#EAF7F1"/>
    <text x="566" y="742" class="sans section-title" font-size="18">写路径与失效</text>
    <text x="566" y="783" class="mono code">DENTRY_CACHE.write()</text>
    <rect x="566" y="800" width="94" height="31" rx="15" fill="#DFF3EA"/>
    <text x="613" y="821" text-anchor="middle" class="mono" font-size="12" fill="#1E806A">insert</text>
    <rect x="674" y="800" width="94" height="31" rx="15" fill="#DFF3EA"/>
    <text x="721" y="821" text-anchor="middle" class="mono" font-size="12" fill="#1E806A">replace</text>
    <rect x="782" y="800" width="94" height="31" rx="15" fill="#FCE7DC"/>
    <text x="829" y="821" text-anchor="middle" class="mono" font-size="12" fill="#B9573B">remove</text>
    <path d="M 887 815 H 934" fill="none" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="566" y="858" class="mono small">remove_parent_dentries()</text>
    <text x="566" y="883" class="sans small">删除一个父目录桶，批量完成失效。</text>

    <!-- Takeaways -->
    <rect x="1000" y="712" width="512" height="196" rx="12" fill="#F7FBFB" stroke="#C9DDE3"/>
    <rect x="1000" y="712" width="512" height="48" rx="12" fill="url(#green-gradient)"/>
    <rect x="1000" y="748" width="512" height="12" fill="url(#green-gradient)"/>
    <text x="1022" y="742" class="sans white-title" font-size="18">面向 BuildStorm 的关键收益</text>
    <circle cx="1029" cy="797" r="5" fill="#52B788"/>
    <text x="1044" y="803" class="sans label">目录分桶：缩小查找与失效范围</text>
    <circle cx="1029" cy="835" r="5" fill="#3EA89B"/>
    <text x="1044" y="841" class="sans label">Borrow&lt;str&gt;：命中路径零分配</text>
    <circle cx="1029" cy="873" r="5" fill="#1E6091"/>
    <text x="1044" y="879" class="sans label">AtomicBool：读锁下也能标记引用</text>
  </g>

  <!-- Footer note -->
  <text x="64" y="970" class="sans tiny">正缓存与负缓存共享同一名字表；缓存只保存元数据映射，真实 inode 由 Arc&lt;Inode&gt; 持有。</text>
</svg>
