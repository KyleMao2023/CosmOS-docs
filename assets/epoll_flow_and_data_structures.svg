<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">CosmOS epoll 流程与数据结构</title>
  <desc id="desc">展示 CosmOS 中 epoll 的持久化兴趣集合、source subscriber 索引、ready 队列，以及 poll 等待注册表之间的注册、通知、休眠和事件收集流程。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .canvas { fill: #f5fbfa; }
      .title { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 31px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 16px; fill: #475569; }
      .source { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; fill: #0f766e; letter-spacing: .2px; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel-head { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .panel-kicker { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; font-weight: 600; fill: #0f766e; letter-spacing: 1px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
      .card-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.25; }
      .card-teal { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.25; }
      .card-cyan { fill: #ecfeff; stroke: #67e8f9; stroke-width: 1.25; }
      .card-purple { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.25; }
      .card-orange { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.25; }
      .card-title { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 14px; fill: #334155; }
      .body-small { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; fill: #1e293b; }
      .mono-small { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 12px; fill: #334155; }
      .mono-strong { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .chip { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .label { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .note { font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; font-size: 12px; fill: #64748b; }
      .num { font-family: "SFMono-Regular", "Cascadia Code", "Noto Sans Mono", monospace; font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow-teal { fill: none; stroke: #0f766e; stroke-width: 2.5; marker-end: url(#arrow-teal); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .arrow-purple { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-purple); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
      .divider { stroke: #dbe5e3; stroke-width: 1; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="1180"/>

  <!-- Header -->
  <text class="title" x="50" y="60">CosmOS epoll：从注册到唤醒的事件路径</text>
  <text class="subtitle" x="52" y="91">持久化 interest set + source subscriber index + 临时 poll wait registry</text>
  <text class="source" x="1748" y="61" text-anchor="end">os/src/fs/epoll.rs · os/src/poll.rs</text>
  <rect x="1558" y="77" width="190" height="27" rx="13.5" fill="#0f766e"/>
  <text class="chip" x="1653" y="95" text-anchor="middle">CURRENT IMPLEMENTATION</text>

  <!-- Registration and persistent data plane -->
  <rect class="panel" filter="url(#shadow)" x="40" y="130" width="1720" height="295" rx="24"/>
  <text class="panel-kicker" x="66" y="162">A · CONTROL PLANE</text>
  <text class="panel-head" x="66" y="190">注册面：epoll 的兴趣集合和反向索引长期存在</text>
  <text class="note" x="1734" y="190" text-anchor="end">ADD 建立订阅；MOD 重置状态；DEL / close 清理订阅</text>

  <rect class="card-blue" x="65" y="212" width="250" height="180" rx="16"/>
  <circle cx="91" cy="240" r="15" fill="#2563eb"/><text class="num" x="91" y="240">1</text>
  <text class="card-title" x="116" y="245">用户态 API</text>
  <text class="mono" x="86" y="279">epoll_create1()</text>
  <text class="mono" x="86" y="307">epoll_ctl(ADD/MOD/DEL)</text>
  <text class="mono" x="86" y="335">epoll_pwait()</text>
  <text class="mono" x="86" y="359">epoll_pwait2()</text>
  <text class="body-small" x="86" y="381">fd + event mask + user data</text>

  <rect class="card-cyan" x="350" y="212" width="390" height="180" rx="16"/>
  <circle cx="376" cy="240" r="15" fill="#0891b2"/><text class="num" x="376" y="240">2</text>
  <text class="card-title" x="401" y="245">EpollFile → EpollInner</text>
  <text class="mono-strong" x="375" y="282">interests</text>
  <text class="mono-small" x="375" y="302">BTreeMap&lt;EpollKey, Arc&lt;EpollItem&gt;&gt;</text>
  <line class="divider" x1="375" y1="318" x2="715" y2="318"/>
  <text class="mono-strong" x="375" y="344">ready</text>
  <text class="mono-small" x="375" y="364">VecDeque&lt;Arc&lt;EpollItem&gt;&gt;</text>
  <text class="body-small" x="375" y="384">每个 live item 最多排队一次</text>

  <rect class="card-teal" x="775" y="212" width="355" height="180" rx="16"/>
  <circle cx="801" cy="240" r="15" fill="#0f766e"/><text class="num" x="801" y="240">3</text>
  <text class="card-title" x="826" y="245">一个 EpollItem</text>
  <text class="mono-small" x="800" y="278">key = (fd, description_id)</text>
  <text class="mono-small" x="800" y="301">target: Arc&lt;FileDescription&gt;</text>
  <text class="mono-small" x="800" y="324">source_id: usize</text>
  <text class="mono-small" x="800" y="347">events / data: Atomic*</text>
  <text class="mono-small" x="800" y="370">state: ALIVE | QUEUED</text>
  <text class="mono-small" x="800" y="389">edge_ready: AtomicU32</text>

  <rect class="card-purple" x="1165" y="212" width="545" height="180" rx="16"/>
  <circle cx="1191" cy="240" r="15" fill="#7c3aed"/><text class="num" x="1191" y="240">4</text>
  <text class="card-title" x="1216" y="245">两个全局 subscriber 索引</text>
  <rect x="1190" y="263" width="235" height="105" rx="11" fill="#ffffff" fill-opacity=".70" stroke="#ddd6fe"/>
  <text class="mono-small" x="1205" y="286">SOURCE_SUBSCRIBERS</text>
  <text class="mono-small" x="1205" y="307">[source_id] → Bucket</text>
  <text class="body-small" x="1205" y="330">通知路径：直接查找</text>
  <text class="mono-small" x="1205" y="353">Vec&lt;Weak&lt;EpollItem&gt;&gt;</text>
  <rect x="1445" y="263" width="240" height="105" rx="11" fill="#ffffff" fill-opacity=".70" stroke="#ddd6fe"/>
  <text class="mono-small" x="1460" y="286">DESCRIPTION_SUBSCRIBERS</text>
  <text class="mono-small" x="1460" y="307">[description_id] → Bucket</text>
  <text class="body-small" x="1460" y="330">最终 close：反向清理</text>
  <text class="mono-small" x="1460" y="353">Vec&lt;Weak&lt;EpollItem&gt;&gt;</text>

  <path class="arrow-blue" d="M 315 302 L 345 302"/>
  <path class="arrow-teal" d="M 740 302 L 770 302"/>
  <path class="arrow-purple" d="M 1130 302 L 1160 302"/>
  <text class="label" x="329" y="290" text-anchor="middle">create / ctl</text>
  <text class="label" x="755" y="290" text-anchor="middle">ADD</text>
  <text class="label" x="1145" y="290" text-anchor="middle">subscribe_item</text>

  <!-- Event notification plane -->
  <rect class="panel" filter="url(#shadow)" x="40" y="450" width="1720" height="450" rx="24"/>
  <text class="panel-kicker" x="66" y="482">B · EVENT PLANE</text>
  <text class="panel-head" x="66" y="510">运行面：一个 source 通知，分叉为 poll 唤醒和 epoll ready 入队</text>
  <text class="note" x="1734" y="510" text-anchor="end">实线：调用 / 数据流　·　虚线：唤醒 / 传播</text>

  <rect class="card-orange" x="65" y="535" width="250" height="320" rx="16"/>
  <circle cx="91" cy="563" r="15" fill="#ea580c"/><text class="num" x="91" y="563">5</text>
  <text class="card-title" x="116" y="568">readiness producer</text>
  <text class="body" x="86" y="606">设备或 IPC 状态发生变化：</text>
  <text class="body" x="86" y="635">• pipe</text>
  <text class="body" x="86" y="660">• eventfd</text>
  <text class="body" x="86" y="685">• TCP / UDP / Unix socket</text>
  <text class="body" x="86" y="710">• UART / tty / signalfd</text>
  <line class="divider" x1="86" y1="732" x2="294" y2="732"/>
  <text class="mono-strong" x="86" y="760">notify_poll_source(</text>
  <text class="mono-strong" x="86" y="781">  source_id, ready_mask)</text>
  <text class="body-small" x="86" y="818">统一入口；ready_mask 包含</text>
  <text class="mono-small" x="86" y="839">POLLIN / POLLOUT / ERR / HUP</text>

  <rect class="card-blue" x="350" y="535" width="425" height="320" rx="16"/>
  <text class="card-title" x="375" y="568">os/src/poll.rs：临时等待后端</text>
  <text class="mono-strong" x="375" y="601">notify_poll_source(...)</text>
  <rect x="375" y="620" width="375" height="92" rx="11" fill="#ffffff" fill-opacity=".75" stroke="#bfdbfe"/>
  <text class="mono-small" x="391" y="644">POLL_REGISTRY  (transient)</text>
  <text class="mono-small" x="391" y="666">kernel_slots[128] × key_slots[128]</text>
  <text class="body-small" x="391" y="691">ppoll / pselect / epoll 休眠时的临时登记</text>
  <text class="body-small" x="391" y="732">扫描匹配 source_id，标记：</text>
  <text class="mono-small" x="391" y="754">PollKeyState::Active → Ready</text>
  <text class="mono-small" x="391" y="778">POLL_WAIT_QUEUE.wake_selected(wait_key)</text>
  <text class="body-small" x="391" y="823">同时调用 epoll::notify_source()</text>

  <rect class="card-teal" x="810" y="535" width="425" height="320" rx="16"/>
  <text class="card-title" x="835" y="568">epoll::notify_source()</text>
  <text class="body-small" x="835" y="595">查找 SOURCE_SUBSCRIBERS[source_id]</text>
  <line class="divider" x1="835" y1="608" x2="1210" y2="608"/>
  <text class="body" x="835" y="636">对每个 Weak&lt;EpollItem&gt;：</text>
  <text class="mono-small" x="835" y="662">alive ∧ interested_in(mask)</text>
  <text class="mono-small" x="835" y="686">∧ current_ready_events() ≠ 0</text>
  <rect x="835" y="704" width="175" height="94" rx="11" fill="#ffffff" fill-opacity=".76" stroke="#a7f3d0"/>
  <text class="mono-small" x="849" y="729">LT（默认）</text>
  <text class="body-small" x="849" y="753">ready → enqueue</text>
  <text class="body-small" x="849" y="776">QUEUED 去重</text>
  <rect x="1025" y="704" width="185" height="94" rx="11" fill="#ffffff" fill-opacity=".76" stroke="#a7f3d0"/>
  <text class="mono-small" x="1039" y="729">ET（EPOLLET）</text>
  <text class="body-small" x="1039" y="753">edge_ready: 0→非零</text>
  <text class="body-small" x="1039" y="776">才 enqueue</text>
  <text class="mono-strong" x="835" y="828">owner.enqueue(item)</text>

  <rect class="card-cyan" x="1270" y="535" width="440" height="320" rx="16"/>
  <text class="card-title" x="1295" y="568">EpollInner.ready：事件队列</text>
  <text class="mono-strong" x="1295" y="602">VecDeque&lt;Arc&lt;EpollItem&gt;&gt;</text>
  <text class="body-small" x="1295" y="628">enqueue() 在锁内：</text>
  <text class="mono-small" x="1295" y="652">try_mark_queued() → push_back()</text>
  <line class="divider" x1="1295" y1="670" x2="1685" y2="670"/>
  <text class="body-small" x="1295" y="697">入队后把 epoll fd 自身标成可读：</text>
  <text class="mono-small" x="1295" y="721">notify_poll_source(inner.source_id(), POLLIN)</text>
  <text class="body-small" x="1295" y="759">因此 epoll_wait 可通过临时 poll key</text>
  <text class="body-small" x="1295" y="781">被无竞态地唤醒。</text>
  <rect x="1295" y="802" width="390" height="32" rx="10" fill="#cffafe" stroke="#67e8f9"/>
  <text class="mono-small" x="1490" y="823" text-anchor="middle">EpollFile.poll(POLLIN) ⇐ has_ready()</text>

  <path class="arrow-orange" d="M 315 695 C 328 695 332 695 345 695"/>
  <path class="arrow-blue" d="M 775 760 C 790 760 795 760 805 760"/>
  <path class="arrow-teal" d="M 1235 695 C 1248 695 1255 695 1265 695"/>
  <text class="label" x="330" y="683" text-anchor="middle">source notify</text>
  <text class="label" x="790" y="748" text-anchor="middle">persistent index</text>
  <text class="label" x="1250" y="683" text-anchor="middle">enqueue</text>

  <!-- Wait, collect, and lifetime -->
  <rect class="panel" filter="url(#shadow)" x="40" y="925" width="1720" height="215" rx="24"/>
  <text class="panel-kicker" x="66" y="957">C · WAIT / DELIVERY / LIFETIME</text>
  <text class="panel-head" x="66" y="984">等待、收集与生命周期</text>

  <rect class="card-purple" x="65" y="1004" width="610" height="110" rx="14"/>
  <text class="card-title" x="87" y="1031">epoll_wait / epoll_pwait / epoll_pwait2</text>
  <text class="mono-small" x="87" y="1056">collect_ready(maxevents)</text>
  <text class="body-small" x="87" y="1078">空队列 → register (epfd, inner.source_id(), POLLIN)</text>
  <text class="body-small" x="87" y="1098">→ recheck → wait_poll_key / timeout / signal → loop</text>

  <rect class="card-teal" x="715" y="1004" width="545" height="110" rx="14"/>
  <text class="card-title" x="737" y="1031">collect_ready：生成用户可见事件</text>
  <text class="mono-small" x="737" y="1056">current_ready_events() → EpollEvent{events, data}</text>
  <text class="body-small" x="737" y="1078">LT：本批次完成后仍 ready → re-enqueue</text>
  <text class="body-small" x="737" y="1098">ET：观察到 ready=0 后，下一次边沿重新 arm</text>

  <rect class="card-orange" x="1300" y="1004" width="410" height="110" rx="14"/>
  <text class="card-title" x="1322" y="1031">close / DEL 清理</text>
  <text class="mono-small" x="1322" y="1056">mark_dead → remove_ready</text>
  <text class="body-small" x="1322" y="1078">DESCRIPTION_SUBSCRIBERS 反向定位</text>
  <text class="body-small" x="1322" y="1098">→ unsubscribe_item（两张索引均清理）</text>

  <path class="arrow-purple" d="M 1490 855 C 1490 910 500 910 500 998"/>
  <path class="arrow-teal" d="M 675 1058 L 708 1058"/>
  <path class="arrow-orange" d="M 1260 1058 L 1293 1058"/>
  <text class="label" x="1075" y="914" text-anchor="middle">ready / wake</text>

  <!-- Legend and implementation notes -->
  <line x1="65" y1="1160" x2="1735" y2="1160" stroke="#dbe5e3"/>
  <line x1="86" y1="1174" x2="128" y2="1174" stroke="#0f766e" stroke-width="2.5"/>
  <text class="note" x="138" y="1178">调用 / 数据流</text>
  <line x1="260" y1="1174" x2="302" y2="1174" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="note" x="312" y="1178">唤醒 / 传播</text>
  <text class="note" x="555" y="1178">关键边界：POLL_REGISTRY 只保存临时睡眠 key；epoll 的 interests、subscriber 索引和 ready 队列独立持久化。</text>
</svg>
