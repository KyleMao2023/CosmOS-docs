<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">CosmOS statx 观测数据与路径跟随耗时</title>
  <desc id="desc">展示当前版本 statx 分阶段平均耗时，以及基线和当前版本共有的路径跟随计数器。</desc>
  <defs>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .panel-title { font-size: 19px; font-weight: 700; fill: #1e293b; }
      .axis { font-size: 13px; fill: #64748b; }
      .label { font-size: 15px; fill: #334155; }
      .value { font-size: 13px; font-weight: 600; fill: #334155; }
      .metric { font-size: 16px; font-weight: 700; fill: #0f766e; }
      .metric-label { font-size: 13px; fill: #64748b; }
      .improve { font-size: 14px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="1280" height="850" fill="#f8fafc"/>
  <text x="64" y="58" class="sans title">statx 观测：路径跟随是主要收益来源</text>
  <text x="64" y="88" class="sans subtitle">/proc/io_perf · 热缓存第二轮 · 当前版分阶段计时与基线共有计数器</text>

  <rect x="48" y="120" width="1184" height="390" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="78" y="160" class="sans panel-title">当前版 statx 分阶段平均耗时</text>
  <text x="78" y="184" class="sans subtitle">307,176 次计时调用；总平均 5.880 µs/call</text>

  <rect x="920" y="128" width="278" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="944" y="153" class="sans metric-label">statx_timed_calls</text>
  <text x="944" y="180" class="sans metric">307,176</text>
  <text x="1080" y="153" class="sans metric-label">empty_path</text>
  <text x="1080" y="180" class="sans metric">101,000</text>
  <text x="944" y="205" class="sans metric-label">avg total</text>
  <text x="1010" y="205" class="sans metric">5.880 µs</text>

  <text x="350" y="224" class="sans axis">0</text>
  <text x="570" y="224" class="sans axis">2</text>
  <text x="790" y="224" class="sans axis">4</text>
  <text x="1010" y="224" class="sans axis">6 µs</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="350" y1="238" x2="350" y2="468"/>
    <line x1="570" y1="238" x2="570" y2="468"/>
    <line x1="790" y1="238" x2="790" y2="468"/>
    <line x1="1010" y1="238" x2="1010" y2="468"/>
  </g>

  <g class="sans label">
    <text x="78" y="260">copyin</text>
    <text x="78" y="296">resolve</text>
    <text x="78" y="332">lookup</text>
    <text x="78" y="368">inode_stat</text>
    <text x="78" y="404">convert</text>
    <text x="78" y="440">copyout</text>
  </g>

  <!-- scale: 110 px = 1 us -->
  <g fill="#0f766e">
    <rect x="350" y="247" width="120.67" height="18" rx="5"/>
    <rect x="350" y="283" width="75.68" height="18" rx="5"/>
    <rect x="350" y="319" width="191.07" height="18" rx="5"/>
    <rect x="350" y="355" width="124.85" height="18" rx="5"/>
    <rect x="350" y="391" width="26.40" height="18" rx="5"/>
    <rect x="350" y="427" width="27.28" height="18" rx="5"/>
  </g>
  <g class="sans value">
    <text x="482" y="261">1.097</text>
    <text x="437" y="297">0.688</text>
    <text x="553" y="333">1.737</text>
    <text x="487" y="369">1.135</text>
    <text x="388" y="405">0.240</text>
    <text x="389" y="441">0.248</text>
  </g>

  <rect x="48" y="534" width="1184" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="78" y="574" class="sans panel-title">共同计数器：路径跟随显著下降，inode stat 基本不变</text>
  <rect x="856" y="554" width="16" height="16" rx="4" fill="#94a3b8"/>
  <text x="880" y="567" class="sans axis">基线 b8e226f</text>
  <rect x="1016" y="554" width="16" height="16" rx="4" fill="#0f766e"/>
  <text x="1040" y="567" class="sans axis">当前 cf37756</text>

  <text x="350" y="602" class="sans axis">0</text>
  <text x="550" y="602" class="sans axis">200k</text>
  <text x="750" y="602" class="sans axis">400k</text>
  <text x="950" y="602" class="sans axis">600k µs</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="350" y1="614" x2="950" y2="614"/>
    <line x1="550" y1="614" x2="550" y2="738"/>
    <line x1="750" y1="614" x2="750" y2="738"/>
    <line x1="950" y1="614" x2="950" y2="738"/>
  </g>

  <text x="78" y="642" class="sans label">lookup_inode_follow_total_us</text>
  <rect x="350" y="626" width="629.84" height="16" rx="5" fill="#94a3b8"/>
  <rect x="350" y="648" width="373.46" height="16" rx="5" fill="#0f766e"/>
  <text x="992" y="639" class="sans value">629,843</text>
  <text x="736" y="661" class="sans value">373,455</text>
  <rect x="1090" y="628" width="86" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1133" y="650" text-anchor="middle" class="sans improve">−40.7%</text>

  <text x="78" y="704" class="sans label">inode_stat_total_us</text>
  <rect x="350" y="688" width="297.69" height="16" rx="5" fill="#94a3b8"/>
  <rect x="350" y="710" width="295.68" height="16" rx="5" fill="#0f766e"/>
  <text x="660" y="701" class="sans value">297,691</text>
  <text x="658" y="723" class="sans value">295,681</text>
  <rect x="1090" y="690" width="86" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1133" y="712" text-anchor="middle" class="sans value">−0.7%</text>

  <text x="64" y="822" class="sans subtitle">dentry misses：2 → 0；virtio read_ops：0 → 0。两边均为热缓存观测，收益主要来自内存内路径处理而非磁盘 I/O。</text>
</svg>
